version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: printporter-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: printporter_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: printporter-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: printporter-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/printporter_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secure_printporter_jwt_secret_key_2026
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  redis_data:
